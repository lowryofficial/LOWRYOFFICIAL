<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HEXLOW | LOWRY Official</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    overflow-x: hidden;
}

/* HEXLOW MAIN SCREEN */

.hexlow-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    overflow: hidden;
}

.hexlow-image {
    display: block;
    width: 100%;
    height: 100vh;
    height: 100svh;
    object-fit: contain;
    object-position: center;
}

/* RETURN TO LOWRY */

.back-lowry {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;

    color: #8aa9cc;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 3px;

    padding: 10px 14px;

    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(80, 140, 210, 0.35);

    transition: 0.3s;
}

.back-lowry:hover {
    color: #ffffff;
    border-color: #4d8ed8;
    box-shadow: 0 0 18px rgba(50, 120, 220, 0.35);
}

</style>
</head>

<body>

<div class="hexlow-page">

    <img
        class="hexlow-image"
        src="7A2892D6-053C-4509-9C0D-2C08660BF486.png"
        alt="HEXLOW"
    >

</div>

<a
    class="back-lowry"
    href="home.html"
>
    ← LOWRY
</a>

</body>

</html>
