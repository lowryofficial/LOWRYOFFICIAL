<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOWRY | Official Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

.entrance {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #000;
}

.entrance img {
    display: block;
    width: 100%;
    height: 100vh;
    height: 100svh;
    object-fit: contain;
    object-position: center;
}

.enter-link {
    position: absolute;
    left: 50%;
    top: 72.5%;
    transform: translate(-50%, -50%);
    width: 44%;
    max-width: 430px;
    height: 10%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.enter-link:focus {
    outline: 1px solid rgba(80, 150, 255, .7);
    outline-offset: 4px;
}
</style>
</head>

<body>

<div class="entrance">

    <img
        src="22F1C257-DC5C-460C-97E0-298E669FF70B.png"
        alt="LOWRY Official - Without Music, Life Would Be A Mistake"
    >

    <a
        class="enter-link"
        href="home.html"
        aria-label="Enter LOWRY Official"
    ></a>

</div>

</body>
</html>
